version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: ["type: chore", "dependencies"]
    # Generated pins/locks belong to an intentional HA/test-stack upgrade, not separate bumps.
    exclude-paths:
      - ".github/locks/**"
      - ".github/ha-requirements.txt"
      - ".github/audit-direct.txt"
      - ".github/requirements-locker.txt"
    groups:
      tooling:
        patterns: ["ruff", "mypy", "pip-audit", "setuptools", "wheel"]
    ignore:
      - dependency-name: homeassistant
      - dependency-name: pytest-homeassistant-custom-component
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: ["type: chore", "dependencies"]
