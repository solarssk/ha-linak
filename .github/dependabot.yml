version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: ["type: chore", "dependencies"]
    assignees: ["solarssk"]
    # GitHub milestone number, not the version. Update before closing the release.
    milestone: 1
    # Referenced inputs must remain fetchable. Filter updates by package, not file.
    exclude-paths:
      - ".github/locks/**"
    allow:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pip-audit
      - dependency-name: pytest-cov
      - dependency-name: setuptools
      - dependency-name: wheel
    groups:
      tooling:
        patterns: ["ruff", "mypy", "pip-audit", "pytest-cov", "setuptools", "wheel"]
    ignore:
      - dependency-name: homeassistant
      - dependency-name: pytest-homeassistant
      - dependency-name: uv
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: ["type: chore", "dependencies"]
    assignees: ["solarssk"]
    # GitHub milestone number, not the version. Update before closing the release.
    milestone: 1
